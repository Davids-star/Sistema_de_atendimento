services:
  - type: web
    name: agendamento-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: agendamento-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://localhost,capacitor://localhost"
      - key: WHATSAPP_AGENT_API_KEY
        value: "m2m_agent_agendamento_secret_token_2026"
      - key: MAIL_MODE
        value: "off"

databases:
  - name: agendamento-db
    plan: free
